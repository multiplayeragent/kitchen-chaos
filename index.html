<script type="module">
/* ═══ KITCHEN CHAOS · a Multiplayer Agent starter ═══════════════════════════════════════
 * Chop, cook and serve before the orders run out. Co-op, 2–4 players; AI cooks fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ round length, timers, scoring, the kitchen layout and the recipes
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   KITCHEN ....... the layout: which tile is a counter, crate, board, stove, window...
 *   GAME (HOST) ... rounds, orders, every item and what grab/drop/chop/serve do to it,
 *                   the AI cooks. Only the host runs this and writes shared state.
 *   SCENE ......... the 3D kitchen, food, chefs, progress bars, particles
 *   ME ............ walking, facing, which station you are looking at, your intents
 *   HUD & RESULTS . tickets, score, clock, results and the leaderboard
 *   INPUT ......... keyboard, touch stick, buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the
 *     last 3s), worked out every frame. The host's browser runs the kitchen.
 *   - The host writes: `game` (ONE JSON field: id, v, phase, timers, score, the open
 *     orders; `v` goes up on every write), `items` (every ingredient and plate: what it is,
 *     how chopped or cooked, and where it is: a station or someone's hands) and `bots`.
 *     Cooking is a timestamp (when the meat went on the stove), so everyone sees the same
 *     sizzle and a new host carries on. A new host adopts all of it.
 *   - Each player writes its OWN entity: `p` (position and facing, ~12/s), `n`/`c`
 *     (name, color) and `hb` once a second. What you hold is whatever `items` says.
 *   - Intents to the host, each naming a station: "grab", "drop", "chop", "serve".
 *     The host checks you are standing at it, then moves the items. Its own apply directly.
 *   - ?attract plays offline with AI cooks only (the preview video is recorded from it).
 *   - Leaderboard "kitchen-score": the team's score at the end of a round.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  roundMs: 180000,       // a round lasts 3 minutes
  readyMs: 3000,         // the countdown before service
  resultsMs: 15000,      // the results show this long, then a new round starts
  orderEvery: 12000,     // a new ticket this often...
  maxOrders: 4,          // ...while fewer than this many are open
  orderMs: 60000,        // a ticket's time limit
  points: 20,            // a served order, plus a tip of up to `tip` for a fast one
  tip: 10,
  missed: 10,            // points lost when a ticket runs out
  chops: 5,              // chops to cut a vegetable
  cookMs: 5000,          // meat on the stove: cooked after this...
  burnMs: 12000,         // ...and burnt after this
  speed: 4.2,            // chef speed, tiles/s
  seats: 3,              // AI cooks fill the kitchen up to this many chefs
  botPace: 0.8,          // AI cooks walk at this share of your speed
  board: "kitchen-score",
  // The kitchen, one character per tile:
  //  . floor   # counter   K chopping board   S stove   P plates   W serving window   X bin
  //  T tomato crate   L lettuce crate   M meat crate   B bun crate
  layout: [
    "##TLMB#PP##",
    "#.........W",
    "K.........W",
    "K...###...#",
    "#.........X",
    "S.........#",
    "##SS#K#####",
  ],
  // Recipes: parts are l (chopped lettuce), t (chopped tomato), m (cooked meat), b (bun).
  recipes: [
    { name: "Salad", parts: "lt" },
    { name: "Burger", parts: "bm" },
    { name: "Deluxe", parts: "blm" },
  ],
};
const PART = { l: { name: "lettuce", color: "#6cc24a" }, t: { name: "tomato", color: "#ff5a4a" }, m: { name: "meat", color: "#8a4b2a" }, b: { name: "bun", color: "#e8b05a" } };
const BOT_NAMES = ["Chef Bo", "Remy", "Gusto", "Pepper", "Basil", "Nori"];
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'kitchen-chaos',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback));
  memo.set(key, { raw, v });
  return v;
}
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── KITCHEN ─────────────────────────────────────────────────────────────────────────
const LAYOUT = CONFIG.layout, KW = LAYOUT[0].length, KH = LAYOUT.length;
const KINDS = { "#": "counter", T: "crate", L: "crate", M: "crate", B: "crate", K: "board", S: "stove", P: "plates", W: "window", X: "bin" };
const charAt = (s) => (typeof s === "number" ? LAYOUT[Math.floor(s / KW)]?.[s % KW] ?? "" : ""); // "" for a chef's hands
const kindAt = (s) => KINDS[charAt(s)] || "floor";
const isFloor = (x, y) => LAYOUT[y]?.[x] === ".";
/** Every station a chef can reach (a non-floor tile next to the floor), by tile index y*KW+x. */
const STATIONS = [];
for (let y = 0; y < KH; y++) for (let x = 0; x < KW; x++) if (!isFloor(x, y) && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => isFloor(x + dx, y + dy))) STATIONS.push(y * KW + x);
const sx = (s) => (s % KW) + 0.5, sy = (s) => Math.floor(s / KW) + 0.5; // a station's centre in tile units
const blocked = (x, y, r) => [[-r, -r], [r, -r], [-r, r], [r, r]].some(([ox, oy]) => !isFloor(Math.floor(x + ox), Math.floor(y + oy)));
function moveBody(e, dx, dy) { if (!blocked(e.x + dx, e.y, 0.3)) e.x += dx; if (!blocked(e.x, e.y + dy, 0.3)) e.y += dy; }
/** The floor tile in front of a station that is nearest to (x, y). */
function spotFor(s, x, y) {
  const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [(s % KW) + dx, Math.floor(s / KW) + dy]).filter(([a, b]) => isFloor(a, b));
  opts.sort((p, q) => Math.hypot(p[0] + 0.5 - x, p[1] + 0.5 - y) - Math.hypot(q[0] + 0.5 - x, q[1] + 0.5 - y));
  return { x: opts[0][0] + 0.5, y: opts[0][1] + 0.5 };
}
/** The next tile centre on the shortest walk to (gx, gy) through the floor. */
function nextStep(x, y, gx, gy) {
  const key = (a, b) => b * KW + a, goal = key(Math.floor(gx), Math.floor(gy)), from = key(Math.floor(x), Math.floor(y)), dist = new Map([[goal, 0]]), q = [goal];
  for (let i = 0; i < q.length; i++) { const c = q[i], cx = c % KW, cy = (c / KW) | 0; for (const [a, b] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) if (isFloor(a, b) && !dist.has(key(a, b))) { dist.set(key(a, b), dist.get(c) + 1); q.push(key(a, b)); } }
  const cx = Math.floor(x), cy = Math.floor(y); let best = null, bd = dist.get(from) ?? 1e9;
  for (const [a, b] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) { const d = dist.get(key(a, b)); if (d !== undefined && d < bd) { bd = d; best = { x: a + 0.5, y: b + 0.5 }; } }
  return best || { x: gx, y: gy };
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
// An item: { i, k: "L"|"T"|"M"|"B"|"P", st: 0 raw, 1 ready, 2 burnt, at: station index or a chef's id, n: chops, cook start or plate contents }
const host = { g: null, items: [], bots: new Map(), wasHost: false, dirtyG: false, dirtyI: false, lastG: 0, lastI: 0, lastB: 0, nextId: 1 };
const hosting = () => isHost() && host.wasHost && host.g; // wasHost: adopted (not leftovers from an earlier turn as host)
const game = () => (hosting() ? host.g : shared("game", null));
const itemList = () => (hosting() ? host.items : shared("items", [], (l) => l.map(([i, k, st, at, n]) => ({ i, k, st, at, n }))));
const botList = () => (hosting() ? [...host.bots.values()].map((b) => ({ i: b.id, n: b.n, c: b.c, x: b.x, y: b.y, f: b.f })) : shared("bots", []));
const itemOn = (s) => itemList().find((it) => it.at === s);
const heldBy = (id) => itemList().find((it) => it.at === id);
/** What an item will be on a plate: l, t, m or b (once chopped or cooked), or null. */
const partOf = (it) => (it.k === "B" ? "b" : it.st === 1 && it.k !== "P" ? it.k.toLowerCase() : null);
const sortStr = (s) => [...s].sort().join("");
const recipeKey = (r) => sortStr(CONFIG.recipes[r].parts);
/** Can `part` go onto a plate holding `c`? Only if some recipe still has room for it. */
const fits = (c, part) => CONFIG.recipes.some((r) => { let rest = r.parts; for (const ch of c + part) { if (!rest.includes(ch)) return false; rest = rest.replace(ch, ""); } return true; });
const cookedFor = (it, t) => (it.at >= 0 && kindAt(it.at) === "stove" ? t - it.n : it.n || 0); // ms of cooking so far

function newRound() {
  const g = host.g, t = Date.now();
  host.g = { id: (g?.id || 0) + 1, v: g?.v || 0, phase: "ready", startAt: t + CONFIG.readyMs, endsAt: t + CONFIG.readyMs + CONFIG.roundMs, score: 0, served: 0, missed: 0, orders: [], nextOrderAt: 0, oid: 1 };
  host.items = []; host.dirtyG = host.dirtyI = true;
  if (ATTRACT) attractSetup();
}
function addOrder(t) {
  const g = host.g; g.orders.push({ id: g.oid++, r: Math.floor(Math.random() * CONFIG.recipes.length), at: t, until: t + CONFIG.orderMs });
  g.nextOrderAt = t + CONFIG.orderEvery; host.dirtyG = true;
}
/** Become host: take over the round and every item exactly as state has them. */
function adopt() {
  host.g = parse(S.shared.game, null);
  host.items = parse(S.shared.items, []).map(([i, k, st, at, n]) => ({ i, k, st, at, n }));
  host.bots.clear();
  for (const b of parse(S.shared.bots, [])) host.bots.set(b.i, { id: b.i, n: b.n, c: b.c, x: b.x, y: b.y, f: b.f, task: null, wait: 0 });
  host.nextId = 1 + Math.max(0, ...host.items.map((it) => it.i));
  if (!host.g) newRound();
  host.dirtyG = true;
}
const posOf = (id) => { if (id === net.sessionId) return me; const b = host.bots.get(id); if (b) return b; return parse(S.entities.players[id]?.p, null); };
const removeItem = (it) => { host.items = host.items.filter((x) => x !== it); };
/** Take meat off the stove: it keeps how long it cooked. */
function offStove(it, t) { if (it.k === "M" && kindAt(it.at) === "stove") it.n = cookedFor(it, t); }

/** One intent from a chef (a player, an AI cook or the host itself), at station s. */
function applyIntent(type, msg, from) {
  const g = host.g, s = msg && msg.s, t = Date.now(), who = posOf(from);
  if (type === "again") { if (g.phase === "over") newRound(); return; }
  if (g.phase !== "play" || !STATIONS.includes(s) || !who || Math.hypot(who.x - sx(s), who.y - sy(s)) > 1.9) return;
  const kind = kindAt(s), h = host.items.find((it) => it.at === from), it = host.items.find((x) => x.at === s);
  const combine = (plate, food) => { const p = partOf(food); if (!p || !fits(plate.n, p)) return false; plate.n = sortStr(plate.n + p); removeItem(food); return true; };
  if (type === "chop") {
    if (kind === "board" && it && (it.k === "L" || it.k === "T") && it.st === 0) { it.n = (it.n || 0) + 1; if (it.n >= CONFIG.chops) it.st = 1; fx(from, "chop", s); }
  } else if (type === "grab") {
    if (!h && it) { offStove(it, t); it.at = from; }
    else if (!h && kind === "crate") host.items.push({ i: host.nextId++, k: charAt(s), st: 0, at: from, n: 0 });
    else if (!h && kind === "plates") host.items.push({ i: host.nextId++, k: "P", st: 0, at: from, n: "" });
    else if (h && h.k === "P" && it && it.k !== "P") { offStove(it, t); if (!combine(h, it)) { if (it.k === "M" && kindAt(s) === "stove") it.n = t - it.n; return; } }
    else if (h && h.k !== "P" && it && it.k === "P") { if (!combine(it, h)) return; }
    else if (h && h.k === "P" && !it && charAt(s) === "B" && fits(h.n, "b")) h.n = sortStr(h.n + "b"); // a bun straight onto the plate
    else return;
  } else if (type === "drop") {
    if (!h) return;
    if (kind === "bin") { if (h.k === "P") h.n = ""; else removeItem(h); fx(from, "bin", s); }
    else if (it && it.k === "P" && h.k !== "P") { if (!combine(it, h)) return; }
    else if (it) return;
    else if (kind === "counter" || (kind === "board" && (h.k === "L" || h.k === "T")) || (kind === "stove" && h.k === "M" && h.st !== 2)) { h.at = s; if (kind === "stove") h.n = t - (h.n || 0); }
    else return;
  } else if (type === "serve") {
    if (kind !== "window" || !h || h.k !== "P") return;
    const o = g.orders.find((o) => recipeKey(o.r) === h.n);
    if (!o) { fx(from, "wrong", s); return; }
    const tip = Math.round(CONFIG.tip * Math.max(0, (o.until - t) / CONFIG.orderMs));
    g.orders = g.orders.filter((x) => x !== o); g.score += CONFIG.points + tip; g.served++;

}
/** Effects every client shows (an event: sounds and sparkles, never the truth). */
function fx(from, kind, s, n) { const m = { kind, s, n }; net.send("fx", m); showFx(m); }

function hostTick(dt, now) {
  if (!host.wasHost) { host.wasHost = true; adopt(); }
  const g = host.g, t = Date.now();
  if (g.phase === "ready" && t >= g.startAt) { g.phase = "play"; addOrder(t); addOrder(t - 6000); }
  if (g.phase === "play") {
    if (g.orders.length < CONFIG.maxOrders && t >= g.nextOrderAt) addOrder(t);
    for (const o of g.orders.filter((o) => t > o.until)) { g.orders = g.orders.filter((x) => x !== o); g.score = Math.max(0, g.score - CONFIG.missed); g.missed++; host.dirtyG = true; }
    for (const it of host.items) if (it.k === "M" && kindAt(it.at) === "stove") { // meat cooks on the stove (from its timestamp)
      const st = t - it.n >= CONFIG.burnMs ? 2 : t - it.n >= CONFIG.cookMs ? 1 : 0;
      if (st !== it.st) { it.st = st; host.dirtyI = true; }
    }
    if (t >= g.endsAt) { Object.assign(g, { phase: "over", endsAt: t + CONFIG.resultsMs }); host.dirtyG = true; }
  }
  if (g.phase === "over" && t >= g.endsAt) newRound();
  const chefsHere = new Set([...livePlayers(), ...host.bots.keys()]);
  for (const it of host.items.filter((it) => typeof it.at === "string" && !chefsHere.has(it.at))) { removeItem(it); host.dirtyI = true; } // dropped by someone who left

// Particles: little cubes (steam, chop bits, sparkles).
const PMAX = 300, parts = [], dummy = new THREE.Object3D();
const pMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85 }), PMAX);
pMesh.setColorAt(0, new THREE.Color("#fff")); pMesh.count = 0; pMesh.frustumCulled = false; scene.add(pMesh);
function burst(x, y, z, color, n = 10, speed = 3, size = 0.12, up = 1) { for (let i = 0; i < n && parts.length < PMAX; i++) { const a = Math.random() * 6.28, u = Math.random(); parts.push({ x, y, z, vx: Math.cos(a) * speed * u, vy: speed * up * (0.4 + Math.random()), vz: Math.sin(a) * speed * u, life: 0, max: 0.5 + Math.random() * 0.4, size, g: 9, color: new THREE.Color(color) }); } }
const puff = (x, y, z, color) => { if (parts.length < PMAX) parts.push({ x: x + (Math.random() - 0.5) * 0.4, y, z: z + (Math.random() - 0.5) * 0.4, vx: 0, vy: 0.9, vz: 0, life: 0, max: 1.1, size: 0.14, g: -0.5, color: new THREE.Color(color) }); };
function partsTick(dt) {
  let n = 0;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt; if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    dummy.position.set(p.x, p.y, p.z); dummy.scale.setScalar(p.size * (1 - p.life / p.max * 0.7)); dummy.rotation.set(p.life * 5, p.life * 3, 0); dummy.updateMatrix();
    pMesh.setMatrixAt(n, dummy.matrix); pMesh.setColorAt(n, p.color); n++;
  }
  pMesh.count = n; pMesh.instanceMatrix.needsUpdate = true; if (pMesh.instanceColor) pMesh.instanceColor.needsUpdate = true;
}
function showFx(m) {
  if (!m || !STATIONS.includes(m.s)) return;
  const x = wx(sx(m.s)), z = wz(sy(m.s));
  if (m.kind === "chop") burst(x, 1.1, z, Math.random() < 0.5 ? "#7fd65a" : "#ff6a5a", 4, 2, 0.08);
  if (m.kind === "served") { burst(x, 1.4, z, "#ffd23f", 26, 5, 0.14); toast(`+${m.n}`); }
  if (m.kind === "wrong") toast("No ticket wants that plate");
  if (m.kind === "bin") burst(x, 1.2, z, "#9aa3ad", 8, 2);
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Brave", "Clever", "Sunny", "Swift", "Lucky", "Mighty"][Math.floor(Math.random() * 6)] + " " + ["Otter", "Fox", "Badger", "Owl", "Panda", "Llama"][Math.floor(Math.random() * 6)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { id: "", x: 2.5, y: 2.5, f: 0, roundId: -1, lastSend: 0, sent: "", task: null, wait: 0, taskAt: 0 };
let myChef = null;
const input = { x: 0, y: 0, grab: false, chop: false, chopAt: 0 };
/** The station I'm facing: the closest one in front of me, within reach. */
function target() {
  let best = null, bd = 9;
  for (const s of STATIONS) {
    const dx = sx(s) - me.x, dy = sy(s) - me.y, d = Math.hypot(dx, dy); if (d > 1.35) continue;
    const off = Math.abs(Math.atan2(Math.sin(Math.atan2(dy, dx) - me.f), Math.cos(Math.atan2(dy, dx) - me.f)));
    if (off < 1.2 && d + off < bd) { bd = d + off; best = s; }
  }
  return best;
}
const act = (type, s) => (isHost() ? applyIntent(type, { s }, net.sessionId) : net.send(type, { s }));
/** Space / GRAB: pick up, put down, combine onto a plate, or serve, depending on what you hold and face. */
function useStation() {
  const s = target(); if (s === null) return;
  const h = heldBy(net.sessionId), it = itemOn(s);
  if (h && h.k === "P" && kindAt(s) === "window") act("serve", s);
  else if (!h || it || (h.k === "P" && charAt(s) === "B")) act("grab", s);
  else act("drop", s);
}
function myTick(dt, g) {
  if (me.roundId !== g.id) { me.roundId = g.id; Object.assign(me, spawnSpot(livePlayers().indexOf(net.sessionId) + (ATTRACT ? 1 : 0))); }
  if (ATTRACT && g.phase === "play" && isHost()) { me.id = net.sessionId; cookTick(me, dt, Date.now(), (type, s) => applyIntent(type, { s }, net.sessionId)); }
  else if (g.phase === "play") {
    const az = camAz(), cs = Math.cos(az), sn = Math.sin(az), mx = input.x * cs - input.y * sn, my = input.x * sn + input.y * cs, len = Math.hypot(mx, my);
    if (len > 0.15) { const k = Math.min(1, len); moveBody(me, (mx / len) * k * CONFIG.speed * dt, (my / len) * k * CONFIG.speed * dt); me.f = Math.atan2(my, mx); }
    if (input.grab) { input.grab = false; useStation(); }
    if (input.chop && performance.now() > input.chopAt) { input.chopAt = performance.now() + 200; const s = target(); if (s !== null) act("chop", s); }
  }
  const p = JSON.stringify({ x: +me.x.toFixed(2), y: +me.y.toFixed(2), f: +me.f.toFixed(2) }), now = performance.now();
  if (p !== me.sent && now - me.lastSend > 80) { me.sent = p; me.lastSend = now; net.me.set("p", p); }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let boardApi = null, boardFor = -1, toastTimer = 0, hintUntil = 0, shownOrders = "";
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").style.opacity = 0), 1200); }
let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud(g) {
  const t = Date.now();
  if (ATTRACT) { for (const id of ["score", "clock", "net", "hint", "count"]) $(id).style.display = "none"; }
  $("score").innerHTML = `${g.score}<small>${g.served} served${g.missed ? ` · ${g.missed} missed` : ""}</small>`;
  const left = Math.max(0, (g.phase === "play" ? g.endsAt : g.phase === "ready" ? g.endsAt : 0) - t);
  $("clock").textContent = g.phase === "over" ? "" : `${Math.floor(left / 60000)}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`;
  $("clock").classList.toggle("low", g.phase === "play" && left < 30000);
  const key = g.orders.map((o) => o.id).join(",");
  if (key !== shownOrders) { shownOrders = key; $("orders").innerHTML = g.orders.map((o) => { const R = CONFIG.recipes[o.r]; return `<div class="ticket"><b>${esc(R.name)}</b>${[...R.parts].map((c) => `<i style="background:${PART[c].color}" title="${PART[c].name}"></i>`).join("")}<u data-o="${o.id}"></u></div>`; }).join(""); }
  for (const u of $("orders").querySelectorAll("u")) { const o = g.orders.find((x) => x.id === +u.dataset.o); if (!o) continue; const k = Math.max(0, (o.until - t) / CONFIG.orderMs); u.style.width = `${k * 100}%`; u.style.background = k < 0.25 ? "#ff5a5a" : k < 0.5 ? "#ffb020" : "#52d273"; }
  $("count").textContent = g.phase === "ready" ? String(Math.max(1, Math.ceil((g.startAt - t) / 1000))) : g.phase === "play" && t - g.startAt < 900 ? "Service!" : "";
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the kitchen" : ""}`;
  $("hint").style.opacity = performance.now() < hintUntil ? 1 : 0;
  $("over").hidden = g.phase !== "over" || ATTRACT;
  if (g.phase === "over") {
    $("overTitle").textContent = `Kitchen closed! ${g.score} points`;
    $("overSub").textContent = `${g.served} orders served · ${g.missed} missed`;
    $("overNext").textContent = `Next service in ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(g.score); }
  }
}
function showBoard(score) {
  const list = $("board");
  if (!boardApi) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? boardApi.submit(score).catch(() => null) : Promise.resolve()).then(() => boardApi.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => act("again", 0);

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("pad").hidden = !touchUI;
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (!keys.has(k) && (k === " " || k === "f")) input.grab = true;
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
function readKeys() {
  if (stick.id !== null) return;
  input.x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  input.y = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (!padChop) input.chop = keys.has("e") || keys.has("c");
}
const stick = { id: null, x: 0, y: 0 }, cv = renderer.domElement;
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); if (e.pointerType === "mouse") return; stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => { if (e.pointerId !== stick.id) return; const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy); input.x = d > 8 ? dx / Math.max(d, 40) : 0; input.y = d > 8 ? dy / Math.max(d, 40) : 0; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = null; input.x = input.y = 0; } });
let padChop = false;
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("on"); if (k === "grab") input.grab = true; else padChop = input.chop = true; });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { b.classList.remove("on"); if (k === "chop") padChop = input.chop = false; });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
/** On a tall screen the camera turns a quarter so the long side of the kitchen runs up the phone. */
const camAz = () => (innerHeight > innerWidth * 1.1 ? -Math.PI / 2 : 0);
function placeCamera(now) {
  const az = camAz(), tall = az !== 0, elev = 1.0, vf = (camera.fov * Math.PI) / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const across = ((tall ? KH : KW) + 1) * TS / 2, deep = ((tall ? KW : KH) + 2.5) * TS / 2;
  const dist = Math.max(across / Math.tan(hf), (deep * Math.sin(elev) + 1.5) / Math.tan(vf)) * (ATTRACT ? 0.76 : 1);
  const sway = ATTRACT ? Math.sin(now / 2400) * 0.1 : 0, lz = tall ? 0 : ATTRACT ? 0.2 : 0.6;
  camera.position.set(Math.sin(sway - az) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(sway - az) * Math.cos(elev) * dist + lz);
  camera.lookAt(0, 0, lz);
}
/** The room's state can arrive just after we join: if someone (or a bot) already had my color, take a free one. */
function fixMyColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots.map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
  if (myChef) { scene.remove(myChef.g); myChef = null; }
}
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the kitchen meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixMyColor(); }
  readKeys();
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  placeCamera(now);
  if (g) {
    myTick(dt, g);
    if (!myChef) myChef = makeChef(myColor, "");
    placeChef(myChef, me.x, me.y, me.f, 1, input.x || input.y || (ATTRACT && me.task));
    const seen = new Set(), live = new Set(livePlayers()); // a closed tab's entity lingers ~30s: draw only live players
    for (const [id, p] of Object.entries(S.entities.players || {})) {
      if (id === net.sessionId || !live.has(id)) continue;
      const q = parse(p.p, null); if (!q) continue;
      seen.add(id); let c = chefs.get(id); if (!c) { c = makeChef(p.c || "#ccc", p.n || "Player"); chefs.set(id, c); }
      placeChef(c, q.x, q.y, q.f, dt, Math.hypot(q.x - c.x, q.y - c.y) > 0.05);
    }
    for (const b of botList()) { seen.add(b.i); let c = chefs.get(b.i); if (!c) { c = makeChef(b.c, ATTRACT ? "" : b.n); chefs.set(b.i, c); } placeChef(c, b.x, b.y, b.f, dt, Math.hypot(b.x - c.x, b.y - c.y) > 0.05); }
    for (const [id, c] of chefs) if (!seen.has(id)) { scene.remove(c.g); chefs.delete(id); }
    syncItems(now);
    const s = g.phase === "play" && !ATTRACT ? target() : null;
    stationGlow.visible = s !== null; if (s !== null) stationGlow.position.set(wx(sx(s)), 0.5, wz(sy(s)));
    glowMat.opacity = 0.25 + Math.sin(now / 150) * 0.1;
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
  partsTick(dt);
  renderer.render(scene, camera);
}

(async function start() {
  if (ATTRACT) CONFIG.seats = 3;
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["grab", "drop", "chop", "serve", "again"]) net.on(type, (m, from) => { if (isHost()) applyIntent(type, m || {}, from); });
  net.on("fx", (m) => showFx(m));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") boardApi = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  $("hint").textContent = touchUI ? "Drag to walk. GRAB picks up, puts down and serves; hold CHOP at a board. Build what the tickets ask for and serve it at the yellow window." : "WASD to walk, Space to pick up, put down or serve, hold E to chop. Build what the tickets ask for and serve it at the yellow window.";
  hintUntil = performance.now() + 14000;
  requestAnimationFrame(frame);
})();
</script>
